[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseaport"
version = "0.1.0"
description = "Unofficial DeepSeek web2api: OpenAI-compatible API over chat.deepseek.com, WAF handled via Obscura headless browser, stable tool_calls for agentic harnesses."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "curl-cffi>=0.7",
  "wasmtime>=20",
  "pydantic>=2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
deepseaport = "deepseaport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
